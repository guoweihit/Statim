# Statim experiment template and named studies / 实验模板与具名实验
# Values are JSON literals; # comments occupy their own lines.
# 参数采用 JSON 值，注释独立成行。数组表示扫描维度，单个值表示固定设置。
# [defaults] provides an inherited template. Each [experiment.NAME] selects a run.
# defaults 是继承模板；每个 experiment.NAME 节登记一组实际实验。
# Choices and applicability are defined in configuration.py and matrix.py.
# 可选范围与适用场景由代码定义，以下注释说明其意义。

[defaults]
# Scenario: "handover" (six-router mobility), "path" (router chain),
# or "occupancy" (independent prefix arrivals and completions).
# 场景可选 handover（六路由器移动）、path（链式路径）、occupancy（前缀到达与完成）。
scenario = "handover"
# Implementations: "statim", "nfd-kite". Path/occupancy use Statim.
# 两种独立实现；路径与占用场景使用 statim。
systems = ["statim", "nfd-kite"]
# Inclusive seed range, integers 1..4294967295. Quick takes the first seed.
# 种子闭区间，正整数；快速模式使用首个种子。
seed_first = 1
seed_last = 30
# Consumer retransmissions: true or false. Controls the request recovery policy.
# 消费者重传开关。改变请求恢复行为，与路由更新后的再次转发独立。
consumer_retransmissions = [true, false]
# Decision-to-effect controller delay in seconds, >=0; occupancy requires >0.
# 控制决策至流表生效的时间，单位秒，非负；占用场景采用正完成延迟。
# Native NFD-KITE has its own local update path; its baseline is shared across this axis.
# NFD-KITE采用本地更新路径，其同一组观测作为各控制延迟下的公共对照。
controller_delay_s = [0, 0.05, 0.1, 0.25, 0.5, 1.0, 2.0]
# Statim: true enables temporary-route forwarding; false uses installed flow-table routes.
# Statim临时路由转发开关；关闭时由已安装的流表路由决定普通Interest的转发。
temporary_forwarding = [true, false]
# Reforward remembered Interests after a routing update, true or false.
# 路由更新后是否再次转发已记录的Interest；两种实现均支持此开关。
interest_reforwarding = [false]

# Network traffic and timing / 网络流量与时间参数
# Interest emission rate, requests per second, >0.
# Interest发送率，单位次/秒，正数。
consumer_cbr_frequency = 1000
# Data payload size in bytes, nonnegative integer.
# Data载荷字节数，非负整数。
payload_bytes = 1024
# Handover time is base + U[0,jitter] seconds. Base >=1, jitter >=0.
# 切换时间为基准加种子产生的均匀偏移，单位秒；基准至少1秒，偏移宽度非负。
handover_base_s = 20
handover_jitter_s = 1
# Post-handover observation window, seconds >0.
# 切换后的统计窗口，单位秒，正数。
observation_window_s = 4
# Simulation stop, seconds >0. Consumers send from 1 to stop_s-2 seconds.
# 结束时刻，单位秒；消费者发送时段为1至stop_s-2秒。
# Keep base+jitter+window < stop_s-2 to include the entire measured sending window.
# 应满足base+jitter+window < stop_s-2，以覆盖完整测量发送窗口。
stop_s = 32
# Producer trace refresh interval in seconds >0.
# 生产者跟踪刷新间隔，单位秒，正数。
refresh_interval_s = 2
# Trace-derived route lifetime in whole milliseconds, expressed as seconds >=0.001.
# 跟踪路由寿命采用整毫秒，以秒填写，至少0.001秒。
# The main study uses L=5 s and refresh R=2 s, leaving overlap for Tc<=2 s.
# 主实验采用5秒寿命、2秒刷新间隔，为不超过2秒的控制时延保留租约交叠余量。
trace_lifetime_s = 5
# Interest packet lifetime in whole milliseconds, expressed as seconds >=0.001.
# Interest报文寿命采用整毫秒，以秒填写，至少0.001秒；用于待处理记录到期检查。
interest_lifetime_s = 2
# Initial RTT estimate in seconds >0; initializes timeout estimation before RTT samples.
# 初始RTT估计，单位秒，正数；用于实际RTT样本到来前的超时估计。
# These durations are independent; RTT supports fractional milliseconds at simulator resolution.
# 报文寿命与RTT初值可分别设置；RTT支持仿真器时间精度内的亚毫秒值。
initial_rtt_estimate_s = 2
# Added stateful delay for accepted cache-miss Interests and received Data, us >=0.
# 被接纳的缓存未命中Interest及接收Data的有状态处理附加时延，单位微秒，非负。
stateful_delay_us = [0]

# Statim controller/update policy in the handover scenario / 主移动场景的更新策略
# Maximum remembered Interests reforwarded per update, integer >=0.
# 每次更新再次转发的Interest数量上限，非负整数。
interest_reforwarding_limit = 1000
# Retain the latest accepted generation after pending state is removed, true/false.
# 是否在待处理状态移除后保留最近接受代次，用于拒绝迟到更新。
generation_guard = false
# Additional controller attempts after timeout, integer >=0.
# 超时后的额外控制请求次数上限，非负整数。
controller_retry_limit = 3
# Probability of dropping a completion notification, 0..1.
# 完成通知丢失概率，取值0至1。
completion_notice_loss = [0]
# Seconds >=0, or "auto". Zero selects completion handling without timed retries.
# 可设非负秒数或auto；0表示按完成事件处理更新。
# Auto uses 2*controller_delay_s+margin for positive loss, and zero for loss=0.
# auto在正丢失概率下使用2*controller_delay_s+margin，零丢失概率下使用0。
controller_retry_timeout_s = "auto"
retry_timeout_margin_s = 0.05

# Path-scenario dimensions / 链式路径场景的维度
# Router-to-router links, integer >=2; consumer joins at rendezvous or middle.
# 路由器间链路数，整数且至少2；消费者可接rendezvous（首节点）或middle（中点）。
trace_path_hops = [4]
consumer_join = ["rendezvous"]
# The path scenario uses trace lifetime and refresh interval greater than stop_s.
# 路径实验使用大于stop_s的路由寿命和刷新间隔，以观察一次跟踪更新。

# Occupancy-scenario dimensions / 前缀状态占用场景的维度
# Exponential arrival rate, prefixes/s >0; total arrivals include the initial burst.
# 指数间隔到达率，单位前缀/秒且为正；总到达数包含初始突发。
arrival_rate_per_s = [50]
arrival_count = 10000
# Prefixes inserted together at time zero, integers 0..arrival_count.
# 零时刻共同插入的前缀数，整数，范围0至arrival_count。
initial_burst = [0]

[experiment.handover_quality]
# Directly inherit the base study: controller delay, handover latency, and request satisfaction.
# 直接继承基础设置，考察控制器时延对切换时延和请求满足情况的影响。
# The same logs also provide final-route checks.
# 同一批日志同时提供最终路由检查。

[experiment.processing_delay]
# Add 6744 us on the configured stateful Interest/Data paths to compare both forwarding choices.
# 在已配置的Interest/Data有状态处理路径增加6744微秒时延，比较两种Statim转发选择。
systems = ["statim"]
controller_delay_s = [0, 0.5, 2.0]
stateful_delay_us = [6744]
consumer_retransmissions = [false]

[experiment.completion_notice_loss]
# Hold the local mechanism enabled and vary successful-update notification loss.
# 启用临时转发，单独扫描更新成功后的通知丢失，观察重试与最终路由。
systems = ["statim"]
temporary_forwarding = [true]
controller_delay_s = [0.1, 0.5]
completion_notice_loss = [0, 0.1, 0.5, 1.0]
# Zero-loss cells share the corresponding handover_quality executions.
# 零丢失单元复用handover_quality中的同参数执行。

[experiment.interest_reforwarding]
# Isolate remembered-Interest reforwarding using flow-table forwarding.
# 在流表转发条件下单独启用已记录Interest再次转发，区分首次到达与持续请求满足。
systems = ["statim"]
temporary_forwarding = [false]
interest_reforwarding = [true]

[experiment.route_expiry_boundary]
# Examine lease-expiry boundaries at L=R=2 s under the common absolute deadline.
# 在寿命与刷新间隔均为2秒时观察共同绝对到期的边界行为。
# The delay choices cover immediate installation, an overlap gap, and expiry at installation.
# 三个控制时延分别覆盖即时安装、刷新交叠空窗和安装时已到期。
systems = ["statim"]
consumer_retransmissions = [false]
controller_delay_s = [0, 0.5, 2]
trace_lifetime_s = 2
refresh_interval_s = 2
analysis_views = ["route_expiry"]

[experiment.path_sensitivity]
# Compare trace path length and consumer convergence point for two forwarding choices.
# 比较路径长度和消费者交汇位置；长寿命与刷新间隔覆盖一次独立跟踪过程。
scenario = "path"
systems = ["statim"]
consumer_retransmissions = [false]
controller_delay_s = [0, 2]
trace_path_hops = [2, 4, 8]
consumer_join = ["rendezvous", "middle"]
handover_base_s = 10
handover_jitter_s = 0.5
stop_s = 18
refresh_interval_s = 100
trace_lifetime_s = 30

[experiment.occupancy]
# Vary arrival intensity and completion delay to quantify pending local state.
# 扫描到达强度与完成延迟，量化待同步临时状态的规模。
scenario = "occupancy"
systems = ["statim"]
arrival_rate_per_s = [10, 50, 100]
controller_delay_s = [0.1, 0.5, 2]

[experiment.occupancy_burst]
# Fix the arrival/completion setting and measure the added finite initial burst.
# 固定到达率与完成延迟，测量有限初始突发增加的状态需求。
scenario = "occupancy"
systems = ["statim"]
arrival_rate_per_s = [50]
controller_delay_s = [0.5]
initial_burst = [32, 128, 512]

[checks]
# Functional programs execute once per run. Available choices are listed here.
# 功能程序在一次执行中各运行一次；可选范围如下。
enabled = true
programs = ["state-table-tests", "statim-packet-pipeline-tests", "statim-controller-faults", "lpm-consistency"]

[microbenchmark]
# Optional host-software profiling. Enable here or with --microbenchmark.
# 可选的宿主软件剖析，可在此启用或使用--microbenchmark。
enabled = false
# Independent process invocations; each contains the specified repetitions.
# 独立进程调用次数，每次调用包含下方指定的内部重复。
invocations = 2
# Lookup operations, trace-update operations, repetitions, and operations per timed batch.
# 查找操作数、跟踪更新操作数、内部重复数、每个计时批次操作数；均为正整数。
# A batch fits inside either operation count.
# 批大小至多为两类操作数的较小值。
lookup_operations = 10000
trace_data_operations = 65536
repetitions = 10
batch = 128

[quick]
# Use the first configured seed and compact occupancy/profiling workloads.
# 采用各实验首个种子并缩短占用/剖析负载，用于快速功能核验。
# Preserve the complete burst and one following arrival, up to the full arrival count.
# 占用单元保留完整突发和一次后续到达，总数以上层完整设置为界。
occupancy_arrival_count = 100
lookup_operations = 512
trace_data_operations = 2048
repetitions = 1
batch = 64
